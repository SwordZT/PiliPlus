name: Build

on:
    # pull_request:
    #     types:
    #         - opened
    #         - synchronize
    #         - reopened
    #         - ready_for_review
    #     paths-ignore:
    #         - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: true
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: true
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: true
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

            publish_artifact_run:
                description: "Publish Android APKs from a successful Build run as a preview (requires tag)"
                required: false
                default: ""
                type: string

jobs:
    publish_preview:
        if: ${{ github.event.inputs.publish_artifact_run != '' && github.event.inputs.tag != '' }}
        name: Publish Android preview
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            BUILD_RUN: ${{ github.event.inputs.publish_artifact_run }}
            PREVIEW_TAG: ${{ github.event.inputs.tag }}
        steps:
            - name: Download existing APKs
              run: |
                  [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
                  mkdir release-assets
                  gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
                  gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts" > artifacts.json
                  python3 - <<'PY'
                  import json, re, subprocess, hashlib, pathlib, os
                  run = json.load(open('run.json'))
                  assert run['conclusion'] == 'success', 'Build must succeed before publishing'
                  assert run['path'] == '.github/workflows/build.yml', 'Expected the Android Build workflow'
                  assets = [a for a in json.load(open('artifacts.json'))['artifacts']
                            if a['name'].endswith('.apk') and not a['expired']]
                  assert len(assets) == 3, 'Expected three Android APKs'
                  root = pathlib.Path('release-assets')
                  sums = []
                  for asset in assets:
                      name = asset['name']
                      assert re.fullmatch(r'PiliPlus_android_[A-Za-z0-9_.+-]+\.apk', name), 'Invalid APK name'
                      path = root / name
                      with path.open('wb') as out:
                          subprocess.run(['gh', 'api', f"repos/{os.environ['GH_REPO']}/actions/artifacts/{asset['id']}/zip"], stdout=out, check=True)
                      sums.append(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + name)
                  (root / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
                  with open(os.environ['GITHUB_ENV'], 'a') as out:
                      out.write('BUILD_SHA=' + run['head_sha'] + '\n')
                  PY
            - name: Publish preview release
              run: |
                  cat > release-assets/notes.md <<'NOTES'
                  局域网遥控模式预览版，两端均需安装。大多数现代手机和平板请选择 arm64-v8a。

                  入口：设置 → 遥控模式。在 Pad 开启被控模式，手机输入地址和六位配对码，连接后正常选片。支持播放/暂停、进度、快进快退、音量、倍速与弹幕开关。手机只传视频信息与指令，音视频由 Pad 自行获取。

                  本预览版使用 Android 调试签名。如果设备上已有不同签名的 PiliPlus，不能直接覆盖安装；更换安装前请备份需要保留的数据。移动端权限、系统音量和实际播放仍需双设备验证。
                  NOTES
                  printf '\n源码提交：%s\n构建记录：https://github.com/%s/actions/runs/%s\n' "$BUILD_SHA" "$GH_REPO" "$BUILD_RUN" >> release-assets/notes.md
                  gh release create "$PREVIEW_TAG" release-assets/*.apk release-assets/SHA256SUMS.txt --target "$BUILD_SHA" --title '遥控模式预览版' --prerelease --notes-file release-assets/notes.md

    android:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              if: github.event_name == 'workflow_dispatch'
              run: |
                  if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                    echo storeFile='key.jks' >> android/key.properties
                    echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                    echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                    echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
                  fi

            - name: Set and Extract version
              if: ${{ github.event_name == 'workflow_dispatch' }}
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: Flutter Build Dev Apk
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPlus_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: PiliPlus_android_*.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliPlus_android_*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: PiliPlus_android_*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_x86_64
                  path: PiliPlus_android_*_x86_64.apk

    ios:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_ios == 'true' }}
        uses: ./.github/workflows/ios.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mac:
        if: ${{ github.event.inputs.build_mac == 'true' }}
        uses: ./.github/workflows/mac.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    win_x64:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_win_x64 == 'true' }}
        uses: ./.github/workflows/win_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    linux_x64:
        if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
        uses: ./.github/workflows/linux_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
